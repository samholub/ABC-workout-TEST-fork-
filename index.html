e("button",{onClick:saveAndFinish,style:{width:"100%",padding:17,background:sess.color,border:"none",borderRadius:16,color:T.bg,fontSize:18,fontWeight:700,cursor:"pointer"}},"Save & Done")))
}

// ── Router ──
if(screen==="home"&&!showHist) return renderHome();
if(showHist) return renderHistory();
if(screen==="gameplan") return renderGamePlan();
if(screen==="workout") return renderActiveWorkout();
if(screen==="complete") return renderSessionComplete();
return null
}

// ========================================================================
// 10. ERROR BOUNDARY & MOUNT
// ========================================================================

class AppBoundary extends R.Component{
constructor(props){super(props);this.state={hasError:false}}
static getDerivedStateFromError(){return{hasError:true}}
componentDidCatch(error,info){console.error("AppBoundary caught:",error,info)}
render(){if(!this.state.hasError)return this.props.children;
var exportBackup=function(){try{var data={version:21,exportDate:new Date().toISOString(),emergency:true,state:S.get(KEYS.state),logs:S.get(KEYS.logs),weights:S.get(KEYS.weights),videos:S.get(KEYS.videos),carry:S.get(KEYS.carry),rest:S.get(KEYS.rest)};saveJsonFile("emergency_backup.json",data)}catch(ex){alert("Export failed: "+ex.message)}};
return e("div",{style:{position:"fixed",inset:0,background:T.bg,color:T.txt,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,fontFamily:"-apple-system,system-ui,sans-serif",textAlign:"center"}},
e("div",{style:{fontSize:48,marginBottom:16}},"\u26A0\uFE0F"),
e("div",{style:{fontSize:20,fontWeight:700,marginBottom:8,color:T.hi}},"Something went wrong."),
e("div",{style:{fontSize:14,color:T.sec,marginBottom:32}},"The app crashed. Your data is safe in storage."),
e("div",{style:{display:"flex",gap:12,flexDirection:"column",width:"100%",maxWidth:280}},
e("button",{onClick:exportBackup,style:{padding:"14px 20px",background:T.acc,border:"none",borderRadius:10,color:T.bg,fontSize:15,fontWeight:700,cursor:"pointer"}},"Export Backup"),
e("button",{onClick:function(){window.location.reload()},style:{padding:"14px 20px",background:T.inp,border:"1px solid "+T.brd,borderRadius:10,color:T.txt,fontSize:15,fontWeight:600,cursor:"pointer"}},"Reload App")))}}
function bootApp(){RD.createRoot(document.getElementById("root")).render(e(AppBoundary,null,e(App)))}
function tryIDBRecovery(){
var critical=[KEYS.logs,KEYS.state,KEYS.weights];
var missing=critical.filter(function(k){var v=localStorage.getItem(k);if(v===null)return true;try{JSON.parse(v)}catch(e){return true}return false});
if(missing.length===0){bootApp();return}
console.log("localStorage missing keys:",missing,". Attempting IDB recovery...");
// Row 62: after a wipe also bring back the session counter, draft and settings.
[KEYS.sessions,KEYS.draft,KEYS.carry,KEYS.rest].forEach(function(k){if(localStorage.getItem(k)===null&&missing.indexOf(k)===-1)missing.push(k)});
Promise.all(missing.map(function(k){return idbGet(k).then(function(v){if(v!=null){try{localStorage.setItem(k,JSON.stringify(v));console.log("Recovered",k,"from IndexedDB")}catch(e){}}}).catch(function(){})})).then(bootApp).catch(bootApp)}
// Row 58: ask the browser not to evict this origin's storage.
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){})}catch(e){}
try{tryIDBRecovery()}catch(e){bootApp()}
</script>
